<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90D9"/>
      <stop offset="100%" style="stop-color:#9B59B6"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <!-- Math symbols -->
  <text x="256" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="120" font-weight="bold" fill="white">×</text>
  <text x="256" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="120" font-weight="bold" fill="white">÷</text>
  <!-- Stars decoration -->
  <text x="80" y="120" font-size="50" fill="#FFD700">★</text>
  <text x="380" y="120" font-size="50" fill="#FFD700">★</text>
  <text x="80" y="450" font-size="50" fill="#FFD700">★</text>
  <text x="380" y="450" font-size="50" fill="#FFD700">★</text>
</svg>
